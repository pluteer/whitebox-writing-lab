[project]
name = "whitebox-writing-api"
version = "0.4.6"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.10",
  "uvicorn[standard]>=0.34",
  "pyyaml>=6.0",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[tool.setuptools]
packages = ["whitebox"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: integration tests that exercise asynchronous workflow execution",
]
addopts = "-ra"
