name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: python ../../tools/check_version.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace apps/web run test
      - run: npm --workspace apps/web run build

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".\apps\api[dev]" pyinstaller
      - name: Build portable runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force packaging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force packaging\runtime, packaging\data, packaging\logs | Out-Null
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm.cmd --workspace apps/web run build
          if ($LASTEXITCODE -ne 0) { throw 'Web build failed' }
          python.exe -m PyInstaller --noconfirm --clean --onedir --name whitebox-api --distpath packaging\runtime --workpath packaging\build --specpath packaging apps\api\server.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (Test-Path packaging\runtime\api) { Remove-Item -Recurse -Force packaging\runtime\api }
          Rename-Item packaging\runtime\whitebox-api api
          New-Item -ItemType Directory -Force packaging\runtime\web | Out-Null
          Copy-Item -Recurse -Force apps\web\dist\* packaging\runtime\web
          Copy-Item -Force launcher\WhiteboxPortable.ps1, launcher\StartWhiteboxPortable.bat, README.md packaging
          tar.exe -a -c -f packaging\whitebox-writing-portable-0.3.0.zip -C packaging runtime data logs WhiteboxPortable.ps1 StartWhiteboxPortable.bat README.md
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive creation failed' }
      - name: Verify portable bundle
        shell: powershell
        run: |
          if (-not (Test-Path .\packaging\runtime\api\whitebox-api.exe)) { throw "API executable is missing" }
          if (-not (Test-Path .\packaging\runtime\web\index.html)) { throw "Web bundle is missing" }
          if (-not (Test-Path .\packaging\whitebox-writing-portable-0.3.0.zip)) { throw "Portable archive is missing" }
      - name: Write SHA256
        shell: powershell
        run: |
          (Get-FileHash .\packaging\whitebox-writing-portable-0.3.0.zip -Algorithm SHA256).Hash | Set-Content .\packaging\whitebox-writing-portable-0.3.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: whitebox-writing-portable-0.3.0
          path: |
            packaging/whitebox-writing-portable-0.3.0.zip
            packaging/whitebox-writing-portable-0.3.0.sha256
