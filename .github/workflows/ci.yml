name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check version consistency
        run: python ../../tools/check_version.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c ../../tools/build-constraints.txt -e ".[dev]"
      - run: pytest

  web:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace apps/web run test
      - run: npm --workspace apps/web run build

  windows-packaging:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        shell: powershell
        run: |
          python -m pip install -c tools/build-constraints.txt -e ".\apps\api[dev]" "pyinstaller==6.14.2"
          if ($LASTEXITCODE -ne 0) { throw "Python packaging dependency installation failed with $LASTEXITCODE" }
          choco install innosetup --version=6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed with $LASTEXITCODE" }
      - name: Build portable archive and installer through the official entry point
        shell: powershell
        run: .\installer\BuildPortable.ps1
      - name: Smoke test portable runtime and silent installer lifecycle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw version.json | ConvertFrom-Json).version
          $required = @(
            '.\packaging\runtime\api\whitebox-api.exe',
            '.\packaging\runtime\web\index.html',
            '.\packaging\version.json',
            '.\packaging\LICENSE',
            ".\packaging\whitebox-writing-portable-$version.zip",
            ".\installer\Output\Whitebox-Writing-$version-Setup.exe"
          )
          foreach ($path in $required) { if (-not (Test-Path -LiteralPath $path)) { throw "Missing artifact: $path" } }
          $list = tar.exe -tf ".\packaging\whitebox-writing-portable-$version.zip"
          foreach ($entry in @('runtime/api/whitebox-api.exe', 'runtime/web/index.html', 'version.json', 'LICENSE')) {
            if ($list -notcontains $entry) { throw "Portable archive is missing $entry" }
          }
          $scripts = @('launcher/WhiteboxPortable.ps1', 'launcher/WhiteboxLauncher.ps1', 'installer/BuildPortable.ps1', 'installer/构建便携包.ps1')
          foreach ($script in $scripts) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors)
            if ($errors.Count) { throw "PowerShell parse failure in ${script}: $($errors -join '; ')" }
          }
          $portable = Resolve-Path .\packaging
          try {
            pwsh -NoProfile -File "$portable\WhiteboxPortable.ps1" -NoBrowser
            $state = Get-Content -Raw "$portable\runtime\api.pid" | ConvertFrom-Json
            $runtime = Invoke-RestMethod http://127.0.0.1:8001/api/runtime-info -Headers @{ 'X-Whitebox-Instance-Token' = $state.instanceToken } -TimeoutSec 5
            if ($runtime.instance_token_valid -ne $true) { throw 'Portable API rejected PID state token' }
          } finally {
            pwsh -NoProfile -File "$portable\WhiteboxPortable.ps1" -Stop
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'Whitebox Writing Smoke'
          $setup = Resolve-Path ".\installer\Output\Whitebox-Writing-$version-Setup.exe"
          $install = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installDir`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent install failed with $($install.ExitCode)" }
          foreach ($name in @('version.json', 'LICENSE', 'launcher\WhiteboxLauncher.ps1')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDir $name))) { throw "Installed payload is missing $name" }
          }
          Set-Content -LiteralPath (Join-Path $installDir 'data\uninstall-smoke.txt') -Value 'preserve'
          $uninstall = Start-Process (Join-Path $installDir 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with $($uninstall.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'data\uninstall-smoke.txt'))) { throw 'Uninstall deleted user data' }
          if (Test-Path -LiteralPath (Join-Path $installDir 'launcher')) { throw 'Uninstall left application payload behind' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whitebox-writing-windows
          path: |
            packaging/whitebox-writing-portable-*.zip
            installer/Output/Whitebox-Writing-*-Setup.exe
